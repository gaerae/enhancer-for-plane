<!doctype html>
<meta charset="utf-8" />
<title>Store capture 3 — width &amp; style rules</title>
<link rel="stylesheet" href="shot.css" />
<style>
  .left { top: 235px; }
  .win { top: 228px; }

  .search {
    display: flex; align-items: center; gap: 9px;
    padding: 11px 14px; border: 1px solid #eceef1; border-radius: 9px;
    font-size: 14px; color: #3f4650;
  }
  .search .caret { width: 1px; height: 15px; background: #b6bcc4; margin-left: 2px; }

  /* The "after" column has to be wide enough to show a full name — it is the whole
     point of the shot, and an ellipsis there would say the opposite of the headline. */
  .cols { display: flex; gap: 20px; margin-top: 18px; }
  .col { min-width: 0; }
  .col.before { flex: 0 0 200px; }
  .col.after { flex: 1; }
  .col h4 {
    font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
    display: flex; align-items: center; gap: 6px; margin-bottom: 9px;
  }
  .col.before h4 { color: #b6bcc4; }
  .col.before h4 .x { color: #dc2626; }
  .col.after h4 { color: #9aa1aa; }
  .col.after h4 .v { color: #16a34a; }

  .item {
    display: flex; align-items: center; gap: 9px;
    padding: 7px 9px; border-radius: 7px; font-size: 13px;
  }
  .item .sw { width: 13px; height: 13px; border-radius: 4px; flex: 0 0 auto; }
  .item .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .col.before .item .nm { max-width: 148px; color: #79818c; }
  .col.after .item .nm { color: #121212; font-weight: 600; }
  .col.after .item.sel { background: #f1f8f4; }
  .col.after .item .tick { margin-left: auto; color: #16a34a; font-size: 12px; }

  .which { margin-top: 11px; text-align: center; font-size: 12px; font-weight: 650; color: #dc2626; }

  /* Rewritten around the work item LIST, which is where the pain actually lands: the search
     dropdown was the whole frame before, and a dropdown is something you open on purpose.
     The list is what is on screen all day, and it is where "which of these three is it"
     costs you a click to find out. Stacked rather than side by side, because a truncated
     name and a full one only argue with each other at the same width. */
  .left { top: 214px; }
  .win { top: 176px; }
  .page { padding: 16px 18px 20px; }

  .grp + .grp { margin-top: 15px; padding-top: 14px; border-top: 1px solid #f1f2f4; }
  .grp h4 {
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
    display: flex; align-items: center; gap: 6px; margin-bottom: 8px; color: #9aa1aa;
  }
  .grp.before h4 .x { color: #dc2626; }
  .grp.after h4 { color: #3f4650; }
  .grp.after h4 .v { color: #16a34a; }

  .row2 { display: flex; align-items: center; gap: 9px; padding: 6px 2px; font-size: 12.5px; }
  .row2 .st { width: 11px; height: 11px; border-radius: 50%; border: 1.6px solid #b6bcc4; flex: 0 0 auto; }
  .row2 .kk {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px;
    color: #9aa1aa; flex: 0 0 auto;
  }
  .row2 .ti { color: #121212; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chips2 { margin-left: auto; display: flex; gap: 6px; flex: 0 0 auto; }
  .cp {
    font-size: 11px; border: 1px solid #e8eaee; border-radius: 6px; padding: 2px 7px;
    color: #3f4650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* 160px is Plane's own max-w-40, and it is what makes three different modules read as one
     word and a half. The rule replaces it with 320. */
  .grp.before .ti { max-width: 132px; }
  .grp.before .cp { max-width: 84px; }
  .grp.after .cp { border-color: #d8ead f; }
  .grp.after .cp { background: #f7fbf8; border-color: #d6ecdd; }

  /* The dropdown keeps a place: it is the same rule and the same 160px, one surface over. */
  .panel.drop { left: 700px; top: 566px; width: 306px; }
  .panel.drop .head { border-bottom: 1px solid #f3f4f6; }
  .dsearch { display: flex; align-items: center; gap: 7px; padding: 9px 13px; font-size: 12px; color: #79818c; }
  .drow { display: flex; align-items: center; gap: 8px; padding: 7px 13px; font-size: 12px; }
  .drow + .drow { border-top: 1px solid #f7f8fa; }
  .drow .sw { width: 11px; height: 11px; border-radius: 3px; flex: 0 0 auto; }
  .drow.sel { background: #f1f8f4; }
  .drow .tick { margin-left: auto; color: #16a34a; font-size: 11px; }
</style>

<div class="left">
  <div class="brand"></div>
  <h1 data-t="head"></h1>
  <p class="lede" data-t="lede"></p>
  <div class="pill">.max-w-40 → 320px<span class="dot">·</span>!important</div>
</div>

<div class="win">
  <div class="bar">
    <span class="url">plane.example.com <span class="sep">/</span> <span class="path" data-t="crumb"></span></span>
  </div>
  <div class="page">
    <div class="grp before">
      <h4><span class="x">✕</span> <span data-t="before"></span></h4>
      <div class="row2">
        <span class="st"></span><span class="kk">PROJ-142</span>
        <span class="ti" data-t="t1"></span>
        <span class="chips2"><span class="cp" data-t="m1"></span><span class="cp" data-t="c1"></span></span>
      </div>
      <div class="row2">
        <span class="st"></span><span class="kk">PROJ-138</span>
        <span class="ti" data-t="t2"></span>
        <span class="chips2"><span class="cp" data-t="m2"></span><span class="cp" data-t="c1"></span></span>
      </div>
      <div class="row2">
        <span class="st"></span><span class="kk">PROJ-131</span>
        <span class="ti" data-t="t3"></span>
        <span class="chips2"><span class="cp" data-t="m3"></span><span class="cp" data-t="c1"></span></span>
      </div>
    </div>
    <div class="grp after">
      <h4><span class="v">✓</span> <span data-t="after"></span></h4>
      <div class="row2">
        <span class="st"></span><span class="kk">PROJ-142</span>
        <span class="ti" data-t="t1"></span>
        <span class="chips2"><span class="cp" data-t="m1"></span><span class="cp" data-t="c1"></span></span>
      </div>
      <div class="row2">
        <span class="st"></span><span class="kk">PROJ-138</span>
        <span class="ti" data-t="t2"></span>
        <span class="chips2"><span class="cp" data-t="m2"></span><span class="cp" data-t="c1"></span></span>
      </div>
      <div class="row2">
        <span class="st"></span><span class="kk">PROJ-131</span>
        <span class="ti" data-t="t3"></span>
        <span class="chips2"><span class="cp" data-t="m3"></span><span class="cp" data-t="c1"></span></span>
      </div>
    </div>
  </div>
</div>

<div class="panel drop">
  <div class="head" data-t="dropHead"></div>
  <div class="dsearch">🔍 <span data-t="query"></span></div>
  <div class="drow"><span class="sw" style="background:#3b82f6"></span><span data-t="m1"></span></div>
  <div class="drow sel"><span class="sw" style="background:#a855f7"></span><span data-t="m2"></span><span class="tick">✓</span></div>
  <div class="drow"><span class="sw" style="background:#10b981"></span><span data-t="m3"></span></div>
</div>

<div class="caption" data-t="caption"></div>

<script>
  // The same strings in both groups. The only difference between them is the width they are
  // allowed, which is the entire claim — writing shorter names into the "after" rows would
  // prove nothing and would be a lie about what the rule does.
  window.T = {
    en: {
      head: "Tell your<br />items apart.",
      lede:
        "Plane caps names at 160px, so a list of work items in the same module reads as three " +

        "the title, the module and the cycle <b>in full</b>, in the list and in every dropdown.",
      crumb: "work items",
      before: "Plane's 160px cap",
      after: "With the width rule",
      t1: "Checkout fails on Safari 17",
      t2: "Checkout fails on the second attempt",

    ko: {

        "Plane은 이름을 160px에서 자릅니다. 같은 모듈에 속한 작업 항목 목록이 같은 낱말 세 개로 " +
        "보이고, 어느 것인지 확인하려면 하나씩 눌러 봐야 합니다. 폭 규칙 하나면 제목도 모듈도 " +
        "사이클도 <b>전부</b> 보입니다 — 목록에서도, 모든 드롭다운에서도.",
      crumb: "작업 항목",
      before: "Plane 기본 160px",
      after: "폭 규칙 적용",
      t1: "Safari 17에서 결제 실패",
      t2: "두 번째 시도에서 결제 실패",
      t3: "저장된 카드로 결제 실패",
      m1: "빌링 — 결제",
      m2: "빌링 — 환불",
      m3: "빌링 — 인보이스",

      query: "빌링",
      caption:
        "제목·모듈·사이클·라벨·상단 경로가 모두 같은 제한을 씁니다 — 규칙 하나로 끝내거나, " +
        "팝업의 <b>요소 선택</b>으로 거슬리는 것을 직접 가리키면 됩니다"
    }
  };
</script>
<script src="shot.js"></script>
