<!doctype html>
<meta charset="utf-8" />
<title>Store capture 2 — width &amp; style rules</title>
<link rel="stylesheet" href="shot.css" />
<style>
  .left { top: 235px; }
  .win { top: 228px; }

  .search {
    display: flex; align-items: center; gap: 9px;
    padding: 11px 14px; border: 1px solid #eceef1; border-radius: 9px;
    font-size: 14px; color: #3f4650;
  }
  .search .caret { width: 1px; height: 15px; background: #b6bcc4; margin-left: 2px; }

  /* The "after" column has to be wide enough to show a full name — it is the whole
     point of the shot, and an ellipsis there would say the opposite of the headline. */
  .cols { display: flex; gap: 20px; margin-top: 18px; }
  .col { min-width: 0; }
  .col.before { flex: 0 0 200px; }
  .col.after { flex: 1; }
  .col h4 {
    font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
    display: flex; align-items: center; gap: 6px; margin-bottom: 9px;
  }
  .col.before h4 { color: #b6bcc4; }
  .col.before h4 .x { color: #dc2626; }
  .col.after h4 { color: #9aa1aa; }
  .col.after h4 .v { color: #16a34a; }

  .item {
    display: flex; align-items: center; gap: 9px;
    padding: 7px 9px; border-radius: 7px; font-size: 13px;
  }
  .item .sw { width: 13px; height: 13px; border-radius: 4px; flex: 0 0 auto; }
  .item .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .col.before .item .nm { max-width: 148px; color: #79818c; }
  .col.after .item .nm { color: #121212; font-weight: 600; }
  .col.after .item.sel { background: #f1f8f4; }
  .col.after .item .tick { margin-left: auto; color: #16a34a; font-size: 12px; }

  .which { margin-top: 11px; text-align: center; font-size: 12px; font-weight: 650; color: #dc2626; }
</style>

<div class="left">
  <div class="brand"></div>
  <h1 data-t="head"></h1>
  <p class="lede" data-t="lede"></p>
  <div class="pill">.max-w-40 → 320px<span class="dot">·</span>!important</div>
</div>

<div class="win">
  <div class="bar">
    <span class="url">plane.example.com <span class="sep">/</span> <span class="path" data-t="crumb"></span></span>
  </div>
  <div class="page">
    <div class="search">🔍 <span data-t="query"></span><span class="caret"></span></div>
    <div class="cols">
      <div class="col before">
        <h4><span class="x">✕</span> <span data-t="before"></span></h4>
        <div class="item"><span class="sw" style="background:#3b82f6"></span><span class="nm" data-t="n1"></span></div>
        <div class="item"><span class="sw" style="background:#a855f7"></span><span class="nm" data-t="n2"></span></div>
        <div class="item"><span class="sw" style="background:#10b981"></span><span class="nm" data-t="n3"></span></div>
        <div class="which" data-t="which"></div>
      </div>
      <div class="col after">
        <h4><span class="v">✓</span> <span data-t="after"></span></h4>
        <div class="item"><span class="sw" style="background:#3b82f6"></span><span class="nm" data-t="n1"></span></div>
        <div class="item sel"><span class="sw" style="background:#a855f7"></span><span class="nm" data-t="n2"></span><span class="tick">✓</span></div>
        <div class="item"><span class="sw" style="background:#10b981"></span><span class="nm" data-t="n3"></span></div>
      </div>
    </div>
  </div>
</div>

<div class="caption" data-t="caption"></div>

<script>
  // The three names are the same strings in both columns — the only difference between
  // before and after is the width they are given, which is exactly the claim.
  window.T = {
    en: {
      head: "Tell your<br />items apart.",
      lede:
        "Cut-off names blur together — worst in <b>search dropdowns</b>, where you can't tell " +
        "which item you're picking. A width rule shows them <b>in full</b>.",
      crumb: "cycles",
      query: "Q3 Product Launch",
      before: "Before",
      after: "After",
      which: "Which one?",
      n1: "Q3 Product Launch Roadmap — Mobile",
      n2: "Q3 Product Launch Roadmap — Web",
      n3: "Q3 Product Launch Roadmap — API",
      caption: "List views and search dropdowns · <b>modules, cycles &amp; labels</b>"
    },
    ko: {
      head: "어느 항목인지<br />한눈에.",
      lede:
        "잘린 이름은 서로 구별되지 않습니다. 무엇을 고르는지 알 수 없는 <b>검색 드롭다운</b>에서 " +
        "특히 그렇습니다. 폭 규칙 하나면 <b>전부 보입니다</b>.",
      crumb: "사이클",
      query: "3분기 제품 출시",
      before: "이전",
      after: "이후",
      which: "어느 쪽이지?",
      n1: "3분기 제품 출시 로드맵 — 모바일",
      n2: "3분기 제품 출시 로드맵 — 웹",
      n3: "3분기 제품 출시 로드맵 — API",
      caption: "목록과 검색 드롭다운 · <b>모듈·사이클·라벨</b>"
    }
  };
</script>
<script src="shot.js"></script>
