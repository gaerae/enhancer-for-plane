<!doctype html>
<meta charset="utf-8" />
<title>Store capture 3 — width rules</title>
<link rel="stylesheet" href="shot.css" />
<style>
  /* Two real captures of the same four rows on Plane Cloud's work item list, without the
     rule and with it (real/width-off, real/width-on). Taken 2026-11-10 in a 1728px-wide
     window, because Cloud shows the module chip only on a row wide enough for it and folds
     it into "+1" below that. The rule is the shipped preset at its shipped 320px; the
     English module names are longer than that and stay cut, just later, and the frame is
     left that way rather than lengthening the rule for the picture.
     A strip of rows is wide and short, so this poster stacks the two frames full width
     under the headline instead of using the left column the others share. */
  .top { position: absolute; left: 72px; right: 72px; top: 58px; display: flex; gap: 56px; }
  .top .head { flex: 0 0 470px; }
  .top .brand { margin-bottom: 20px; }
  .top h1 { margin-bottom: 0; }
  .top .side { flex: 1; padding-top: 46px; }
  .top .pill { margin-top: 18px; }

  .shot { left: 72px; width: 1136px; border-radius: 10px; }
  .shot.before { top: 324px; }
  .shot.after { top: 548px; }
  .tag { display: inline-flex; align-items: center; gap: 6px; }
  .tag.before { left: 88px; top: 296px; background: #fff; color: #6b7280; }
  .tag.after { left: 88px; top: 520px; }
  .tag .v { color: #4ade80; }
  .caption { bottom: 22px; }
  .lang-ko .top h1 { font-size: 44px; }
</style>
<div class="top">
  <div class="head">
    <div class="brand"></div>
    <h1 data-t="head"></h1>
  </div>
  <div class="side">
    <p class="lede" data-t="lede"></p>
    <div class="pill">.max-w-\[224px\] → 320px<span class="dot">·</span>!important</div>
  </div>
</div>
<span class="tag before">✕ <span data-t="before"></span></span>
<div class="shot before"><img data-src="real/width-off" alt="" /></div>
<span class="tag after"><span class="v">✓</span> <span data-t="after"></span></span>
<div class="shot after"><img data-src="real/width-on" alt="" /></div>
<div class="caption" data-t="caption"></div>
<script>
  window.T = {
    en: {
      head: "Tell your<br />items apart.",
      lede:
        "Plane cuts a module's name in the work item list at 224px, so modules that start " +
        "alike read as one. The shipped width rule lets the name run to <b>320px</b>, and " +
        "the width is yours to change.",
      before: "As Plane draws it",
      after: "With the width rule",
      caption:
        "One rule per place you want widened — or click <b>Pick element</b> in the popup " +
        "and point at whichever name is bothering you"
    },
    ko: {
      head: "어느 항목인지<br />한눈에.",
      lede:
        "Plane은 작업 항목 목록에서 모듈 이름을 224px에서 자릅니다. 앞부분이 같은 모듈은 " +
        "서로 구별되지 않습니다. 기본으로 들어 있는 폭 규칙이 이름을 <b>320px</b>까지 펼치고, " +
        "폭은 원하는 대로 바꿀 수 있습니다.",
      before: "Plane 기본 화면",
      after: "폭 규칙 적용",
      caption:
        "넓히고 싶은 곳마다 규칙 하나씩 — 제목, 모듈, 사이클, 라벨, 상단 경로 어디든 됩니다. " +
        "팝업의 <b>요소 선택</b>으로 거슬리는 이름을 직접 가리켜도 됩니다"
    }
  };
</script>
<script src="shot.js"></script>
