<!doctype html>
<meta charset="utf-8" />
<title>Store capture 1 — quick open</title>
<link rel="stylesheet" href="shot.css" />
<style>
  .left { top: 236px; }
  /* Three real captures of Chrome's own UI, taken from a screen recording of a real window:
     the address bar's dropdown, the right-click menu on a key in a comment, and the popup. */
  .shot.omni { left: 548px; top: 104px; width: 680px; }
  .shot.ctx { left: 548px; top: 352px; width: 400px; }
  .shot.pop { left: 984px; top: 292px; width: 244px; height: 440px; border-radius: 10px; }
  .tag.omni { left: 564px; top: 76px; }
  .tag.ctx { left: 564px; top: 324px; }
  .tag.pop { left: 1000px; top: 264px; }
  .caption { bottom: 22px; }
</style>
<div class="left">
  <div class="brand"></div>
  <h1 data-t="head"></h1>
  <p class="lede" data-t="lede"></p>
  <div class="pill" data-t="pill"></div>
</div>
<span class="tag omni" data-t="tOmni"></span>
<div class="shot omni"><img data-src="real/omnibox" alt="" /></div>
<span class="tag ctx" data-t="tCtx"></span>
<div class="shot ctx"><img data-src="real/ctxmenu" alt="" /></div>
<span class="tag pop" data-t="tPop"></span>
<div class="shot pop"><img data-src="real/popup" alt="" /></div>
<div class="caption" data-t="caption"></div>
<script>

        "Plane, Jira, Linear, GitHub, GitLab"
    }
  };
</script>
