<!doctype html>
<meta charset="utf-8" />
<title>Store capture 2 — focus mode</title>
<link rel="stylesheet" href="shot.css" />
<style>
  /* Focus mode replaced the element picker in this slot. The picker is how you MAKE a rule
     — a tool, and one that needs a paragraph before it means anything. Focus mode is the
     opposite: two frames side by side and the feature has explained itself, which is the
     only kind of explaining a store screenshot gets to do. */
  .left { top: 224px; }
  /* Two real captures of the same work item, before and after. The cards overlap so each
     can be large enough for the layout to read; the front one is the result. */
  .shot { width: 640px; }
  .shot .bar { padding: 10px 14px; gap: 10px; }
  .shot .url { padding: 5px 12px; font-size: 12px; }
  .shot.before { left: 556px; top: 72px; height: 352px; }
  .shot.after { left: 604px; top: 318px; height: 404px; }
  .tag { display: inline-flex; align-items: center; gap: 6px; }
  .tag.before { left: 572px; top: 44px; background: #fff; color: #6b7280; }
  .tag.after { left: 620px; top: 290px; background: #121212; color: #fff; }
  .tag .v { color: #4ade80; }
  .caption { bottom: 22px; }
</style>
<div class="left">
  <div class="brand"></div>
  <h1 data-t="head"></h1>
  <p class="lede" data-t="lede"></p>
  <div class="pill">Alt+Shift+F<span class="dot">·</span>⌥+⇧+F</div>
</div>
<span class="tag before">✕ <span data-t="before"></span></span>
<div class="shot before">
  <div class="bar"><span class="url">app.plane.so <span class="sep">/</span> <span class="path" data-t="path"></span></span></div>
  <img data-src="real/focus-off" alt="" />
</div>
<span class="tag after"><span class="v">✓</span> <span data-t="after"></span></span>
<div class="shot after">
  <div class="bar"><span class="url">app.plane.so <span class="sep">/</span> <span class="path" data-t="path"></span></span></div>
  <img data-src="real/focus-on" alt="" />
</div>
<div class="caption" data-t="caption"></div>
<script>
  window.T = {
    en: {
      head: "Put the panels away.<br />Read the ticket.",
      lede:
        "Plane pins the properties panel to the right of a work item with no way to collapse " +
        "it. <b>Focus mode</b> hides it and the left navigation, and the description takes " +
        "back the width.",
      path: "browse / SHOP-1",
      before: "Normally",
      after: "Focus mode",
      caption:
        "It applies to that tab, survives a reload there, and is <b>never synced</b> to your " +
        "other devices — and any rule of yours can be marked focus-only"
    },
    ko: {
      head: "패널을 치우고<br />본문만 읽으세요.",
      lede:
        "Plane은 작업 항목 오른쪽에 속성 패널을 접을 방법 없이 고정해 둡니다. " +
        "<b>집중 모드</b>가 그것과 왼쪽 내비게이션을 숨기면 설명이 그 폭을 되찾습니다.",
      path: "browse / STORE-1",
      before: "평소",
      after: "집중 모드",
      caption:
        "켠 탭에서만 적용되고 새로 고쳐도 유지되며 <b>다른 기기로는 동기화되지 않습니다</b> — " +
        "직접 만든 규칙도 집중 모드 전용으로 표시할 수 있습니다"
    }
  };
</script>
<script src="shot.js"></script>
