<!doctype html>
<meta charset="utf-8" />
<title>Store capture 5 — visual element picker</title>
<link rel="stylesheet" href="shot.css" />
<style>
  .left { top: 208px; }
  .win { top: 198px; }
  .page { padding: 26px 26px 96px; }

  .url .picking { color: #dc2626; font-weight: 700; }

  /* the outline the picker draws over the element under the cursor */
  .hit {
    display: inline-block; padding: 10px 15px; border-radius: 8px;
    border: 2px solid #121212; font-size: 15px; font-weight: 650; letter-spacing: -0.01em;
  }

  .panel.chooser { left: 611px; top: 353px; width: 337px; }
  .panel.chooser .row { display: flex; align-items: center; gap: 12px; padding: 10px 15px; }
  .panel.chooser .row + .row { border-top: 0; }
  .sel {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px;
    color: #121212; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .cnt {
    margin-left: auto; flex: 0 0 auto; background: #f1f2f4; color: #79818c;
    border-radius: 999px; padding: 3px 9px; font-size: 11px; font-weight: 600;
  }
</style>

<div class="left">
  <div class="brand"></div>
  <h1 data-t="head"></h1>
  <p class="lede" data-t="lede"></p>
  <div class="pill" data-t="pill"></div>
</div>

<div class="win">
  <div class="bar">
    <span class="url">plane.example.com <span class="sep">·</span> <span class="picking" data-t="picking"></span></span>
  </div>
  <div class="page">
    <span class="hit" data-t="hit"></span>
  </div>
</div>

<div class="panel chooser">
  <div class="head" data-t="chooserHead"></div>
  <div class="row on"><span class="sel">.max-w-[150px]</span><span class="cnt" data-t="c1"></span></div>
  <div class="row"><span class="sel">.truncate</span><span class="cnt" data-t="c12"></span></div>
  <div class="row"><span class="sel">.line-clamp-1</span><span class="cnt" data-t="c3"></span></div>
  <div class="row"><span class="sel">.flex</span><span class="cnt" data-t="c6"></span></div>
  <div class="row"><span class="sel">.relative</span><span class="cnt" data-t="c148"></span></div>
</div>

<div class="caption" data-t="caption"></div>

<script>
  // chooserHead and the counts are the extension's own strings for that locale
  // (_locales/*/messages.json → pickHeader, pickMatches), not a translation made here.
  window.T = {
    en: {
      head: "Point-and-click<br />rules.<br />No DevTools.",
      lede:
        "Click <b>Pick element</b>, hover any part of Plane, and choose a selector by its " +
        "<b>match count</b>. The rule lands in Settings, ready to tune.",
      pill: "Pick → choose selector → set value",
      picking: "🎯 picking…",
      hit: "Q3 Billing &amp; Invoicing Revamp",
      chooserHead: "Create a rule from a selector&nbsp;&nbsp;·&nbsp;&nbsp;Esc to cancel",
      c1: "matches 1",
      c12: "matches 12",
      c3: "matches 3",
      c6: "matches 6",
      c148: "matches 148",
      caption: "Width classes ranked first · bracket classes like <b>max-w-[150px]</b> escaped for you"
    },
    ko: {
      head: "클릭으로 만드는<br />규칙.<br />DevTools 없이.",
      lede:
        "팝업에서 <b>요소 선택</b>을 누르고 Plane의 아무 곳이나 클릭하면, <b>일치 개수</b>를 보고 " +
        "선택자를 고를 수 있습니다. 규칙은 설정에 담깁니다.",
      pill: "선택 → 선택자 고르기 → 값 입력",
      picking: "🎯 선택 중…",
      hit: "3분기 청구·인보이스 개편",
      chooserHead: "선택자로 규칙 만들기&nbsp;&nbsp;·&nbsp;&nbsp;Esc로 취소",
      c1: "1개 일치",
      c12: "12개 일치",
      c3: "3개 일치",
      c6: "6개 일치",
      c148: "148개 일치",
      caption: "폭 관련 클래스가 먼저 · <b>max-w-[150px]</b> 같은 대괄호 클래스는 알아서 이스케이프"
    }
  };
</script>
<script src="shot.js"></script>
