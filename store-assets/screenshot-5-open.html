<!doctype html>
<meta charset="utf-8" />
<title>Store capture 5 — quick open</title>
<link rel="stylesheet" href="shot.css" />
<style>
  .left { top: 236px; }
  .win { top: 214px; }

  /* The omnibox is the whole feature, so the capture is the address bar rather than a
     page: a keyword chip, the typed key, and the suggestion Chrome draws underneath. */
  .bar { padding: 16px 18px; }
  .omni {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 9px;
    height: 34px;
    padding: 0 13px;
    border-radius: 999px;
    background: #fff;
    border: 1px solid #e3e5e9;
    box-shadow: 0 1px 2px rgba(18, 18, 18, 0.05);
  }
  .kw {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: #fff;
    background: #121212;
    border-radius: 5px;
    padding: 2px 7px;
  }
  .typed {
    font-size: 14px;
    font-weight: 600;
    color: #121212;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .caret {
    width: 1.5px;
    height: 17px;
    background: #121212;
    margin-left: -3px;
  }
  .page { padding: 0; }

  /* Suggestion list, drawn as the omnibox dropdown: flush under the bar, full width. */
  .sugg { border-top: 1px solid #eceef1; }
  .sugg .row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 20px;
  }
  .sugg .row + .row { border-top: 1px solid #f4f5f7; }
  .sugg .row.on { background: #f7f8fa; }
  .go {
    width: 22px;
    height: 22px;
    flex: 0 0 22px;
    border-radius: 6px;
    background: #eceef1;
    color: #121212;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
  }
  .sname { font-size: 13.5px; font-weight: 650; letter-spacing: -0.01em; }
  .surl {
    margin-left: auto;
    font-size: 12px;
    color: #79818c;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .lang-ko .sname { font-weight: 700; }

  /* The same input on the toolbar popup, so the poster shows both ways in. */
  .panel.pop { left: 742px; top: 446px; width: 264px; }
  .panel.pop .head {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #9aa1aa;
  }
  .jumprow { display: flex; gap: 7px; padding: 11px 15px 13px; }
  .jumpkey {
    flex: 1;
    height: 30px;
    border: 1px solid #e3e5e9;
    border-radius: 8px;
    background: #fff;
    display: flex;
    align-items: center;
    padding: 0 10px;
    font-size: 12.5px;
    color: #121212;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .jumpgo {
    width: 34px;
    height: 30px;
    border-radius: 8px;
    background: #121212;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
  }
</style>

<div class="left">
  <div class="brand"></div>
  <h1 data-t="head"></h1>
  <p class="lede" data-t="lede"></p>
  <div class="pill">issue PROJ-142<span class="dot">·</span>Enter</div>
</div>

<div class="win">
  <div class="bar">
    <div class="omni">
      <span class="kw">issue</span>
      <span class="typed">PROJ-142</span>
      <span class="caret"></span>
    </div>
  </div>
  <div class="page">
    <div class="sugg">
      <div class="row on">
        <span class="go">→</span>
        <span class="sname" data-t="s1"></span>
        <span class="surl">plane.example.com/acme/browse/PROJ-142</span>
      </div>
      <div class="row">
        <span class="go">→</span>
        <span class="sname" data-t="s2"></span>
        <span class="surl">linear.app/acme/issue/PROJ-142</span>
      </div>
    </div>
  </div>
</div>

<div class="panel pop">
  <div class="head" data-t="popLabel"></div>
  <div class="jumprow">
    <span class="jumpkey">PROJ-142</span>
    <span class="jumpgo">→</span>
  </div>
</div>

<div class="caption" data-t="caption"></div>

<script>
  // The keyword is the one declared in manifest.omnibox, the suggestion wording is
  // omniboxOpen, and the popup label is popJumpLabel — quoted from the shipped catalogue
  // rather than invented, so the poster cannot promise a string the extension does not say.
  window.T = {
    en: {
      head: "Type the key.<br />You are there.",
      lede:
        "In the address bar type <b>issue</b>, a space, then the work item key — " +
        "<b>Enter opens it</b>. One base link per tool, so Plane, Jira and Linear all work.",
      s1: "Open PROJ-142 in Plane",
      s2: "Open PROJ-142 in Linear",
      popLabel: "Go to work item",
      caption:
        "The key's prefix picks the target — and since it only opens a URL, it needs " +
        "<b>no site access</b> and works on any tab"
    },
    ko: {
      head: "키만 입력하면<br />바로 그 항목.",
      lede:
        "주소창에 <b>issue</b>를 입력하고 한 칸 띄운 뒤 작업 항목 키를 입력하면 " +
        "<b>Enter로 열립니다</b>. 도구마다 기본 링크를 하나씩 두면 Plane·Jira·Linear를 함께 씁니다.",
      s1: "Plane에서 PROJ-142 열기",
      s2: "Linear에서 PROJ-142 열기",
      popLabel: "작업 항목으로 이동",
      caption:
        "키의 접두사가 대상을 고르고, URL만 열기 때문에 <b>사이트 접근 권한이 없어도</b> " +
        "어느 탭에서나 동작합니다"
    }
  };
</script>
<script src="shot.js"></script>
