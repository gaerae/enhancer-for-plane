<!doctype html>
<meta charset="utf-8" />
<title>Store capture 3 — copy reference</title>
<link rel="stylesheet" href="shot.css" />
<style>
  .left { top: 232px; }
  .win { top: 218px; }
  .page { padding: 22px 26px 72px; }

  .keyline { display: flex; align-items: center; gap: 8px; }
  .key { font-size: 13px; font-weight: 500; color: #79818c; }
  .copybtn {
    width: 22px; height: 22px; border-radius: 6px; background: #eceef1;
    display: flex; align-items: center; justify-content: center; color: #121212;
  }
  .doc-title { margin-top: 9px; font-size: 21px; font-weight: 700; letter-spacing: -0.02em; }

  .panel.formats { left: 610px; top: 376px; width: 396px; }
</style>

<div class="left">
  <div class="brand"></div>
  <h1 data-t="head"></h1>
  <p class="lede" data-t="lede"></p>
  <div class="pill">[{{item.key}}]({{item.url}})<span class="dot">·</span>Alt/⌥+C</div>
</div>

<div class="win">
  <div class="bar">
    <span class="url">plane.example.com <span class="sep">/</span> <span class="path" data-t="crumb"></span></span>
  </div>
  <div class="page">
    <div class="keyline">
      <span class="key">PROJ-142</span>
      <!-- the same two-sheet glyph the content script injects -->
      <span class="copybtn">
        <svg viewBox="0 0 16 16" width="12" height="12">
          <rect x="5.75" y="5.75" width="7.5" height="8.5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.3"/>
          <path d="M10.5 3.75H3.9a1.15 1.15 0 0 0-1.15 1.15v6.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
      </span>
    </div>
    <div class="doc-title" data-t="itemTitle"></div>
  </div>
</div>

<div class="panel formats">
  <div class="row">
    <div class="rname" data-t="f1"></div>
    <div class="rprev mono" data-t="p1"></div>
  </div>
  <div class="row on">
    <div class="rname" data-t="f2"></div>
    <div class="rprev mono" data-t="p2"></div>
  </div>
  <div class="row">
    <div class="rname" data-t="f3"></div>
    <div class="rprev mono">feature/PROJ-142</div>
  </div>
  <div class="foot" data-t="manage"></div>
</div>

<div class="caption" data-t="caption"></div>

<script>
  // The three format names are the shipped presets for that locale (PE_DEFAULTS →
  // optCopyPreset*), and "manage" is menuManageCopy. The previews are what the expander
  // actually produces from those formats, title and all.
  window.T = {
    en: {
      head: "Take the item<br />with you.",
      lede:
        "One click beside a work item's ID copies it in <b>the format you wrote</b> — " +
        "for a chat message, a pull request, or a branch name.",
      crumb: "work item",
      itemTitle: "Checkout fails on Safari",
      f1: "Plain text",
      p1: "PROJ-142 Checkout fails on Safari https://plane.example.com/acme/browse/PROJ-142",
      f2: "Markdown link",
      p2: "[PROJ-142](https://plane.example.com/acme/browse/PROJ-142) Checkout fails on Safari",
      f3: "Branch name",
      manage: "＋ Manage copy formats",
      caption: "Every format is yours to edit — and the preview <b>is</b> what lands on the clipboard"
    },
    ko: {
      head: "항목을 그대로<br />가져가기.",
      lede:
        "작업 항목 번호 옆 버튼을 한 번 누르면 <b>직접 정한 형식</b>으로 복사됩니다 — " +
        "메신저로, 풀 리퀘스트 본문으로, 브랜치명으로.",
      crumb: "작업 항목",
      itemTitle: "Safari에서 결제가 실패합니다",
      f1: "일반 텍스트",
      p1: "PROJ-142 Safari에서 결제가 실패합니다 https://plane.example.com/acme/browse/PROJ-142",
      f2: "마크다운 링크",
      p2: "[PROJ-142](https://plane.example.com/acme/browse/PROJ-142) Safari에서 결제가 실패합니다",
      f3: "브랜치명",
      manage: "＋ 참조 복사 형식 관리",
      caption: "형식은 마음대로 고칠 수 있고, 미리보기가 <b>곧</b> 클립보드에 담길 내용입니다"
    }
  };
</script>
<script src="shot.js"></script>
