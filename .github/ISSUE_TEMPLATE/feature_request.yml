name: Feature request
description: Suggest something the extension should do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        One thing worth knowing before you write: this extension deliberately avoids
        reaching into Plane's internals. Plane's class names change between versions, so
        the extension ships a generic "selector + property + value" engine instead of
        hardcoded rules, and it finds the template button by structure rather than by its
        text. A request that needs Plane's editor schema or a specific DOM shape is a
        future breakage, so it gets weighed differently — not refused, but weighed.
        [AGENTS.md](../../AGENTS.md) explains the reasoning if you want the long version.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do that is hard today?
      description: The task, not the solution. What you do now, and where it costs you.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What did you have in mind?
      description: Optional. If you already have a shape in mind, describe it.

  - type: dropdown
    id: where
    attributes:
      label: Would this need to read Plane's page, or only a URL?
      description: >
        Quick open only opens a URL, so it needs no site access and cannot be broken by a
        Plane release. Anything that reads or changes the page is more fragile. If you are
        not sure, pick "not sure".
      options:
        - Only a URL
        - It has to read or change the Plane page
        - Not sure
    validations:
      required: true
