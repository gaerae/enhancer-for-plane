name: Release extension

# Cuts a release straight from the version in manifest.json — no manual tagging.
# Bump "version" in manifest.json and push to main: CI reads it, and if that
# version has no release yet, it packages the zip and creates a DRAFT GitHub
# Release with the zip attached. Unchanged version = skip.
#
# A draft, because the release body is what Settings shows when someone clicks
# their own version number, and --generate-notes can only write a commit list.
# v1.9.0 went public with one before anybody had written the real notes. Now the
# commit list is a private starting point: write the body, then publish — which
# is also when GitHub creates the v<version> tag.
on:
  push:
    branches: [main]
    paths: ["manifest.json"] # only a version (or manifest) change can start a release
  workflow_dispatch: # manual run also works (ignores the path filter)

permissions:
  contents: write # create tags + releases

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from manifest
        id: ver
        run: echo "version=$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Listed rather than looked up by tag: a draft has no tag until it is
          # published, and the by-tag endpoint does not return drafts, so a lookup
          # would miss the draft this workflow made on the last run and cut another.
          # The list does include drafts for a token that can push, which this one can.
          tag="v${{ steps.ver.outputs.version }}"
          if gh api "repos/${{ github.repository }}/releases" --paginate --jq ".[].tag_name" | grep -qx "$tag"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v${{ steps.ver.outputs.version }} already released — skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package extension
        if: steps.check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          ZIP="enhancer-for-plane-${VERSION}.zip"
          zip -r "$ZIP" \
            manifest.json common.js content.js content.css background.js \
            options.html options.js options.css \
            popup.html popup.js popup.css icons _locales \
            -x "icons/icon.svg"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          unzip -l "$ZIP"

      - name: Create tag + Release with zip
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          gh release create "v${VERSION}" "$ZIP" \
            --target "${{ github.sha }}" \
            --title "Enhancer for Plane v${VERSION}" \
            --generate-notes \
            --draft

      - name: Upload build artifact
        if: steps.check.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: enhancer-for-plane-${{ steps.ver.outputs.version }}
          path: ${{ env.ZIP }}
          if-no-files-found: error
