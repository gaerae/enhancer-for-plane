<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Enhancer for Plane</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="pop">
      <header class="pop-head">
        <img src="icons/icon48.png" alt="" width="22" height="22" />
        <strong>Enhancer for Plane</strong>
      </header>

      <label class="pop-toggle">
        <span data-i18n="popEnabled">Enabled</span>
        <input type="checkbox" id="enabled" />
        <span class="switch"></span>
      </label>

      <div class="pop-status" id="domainStatus" data-i18n="popChecking">Current site: checking…</div>

      <div class="pop-row">
        <span class="pop-row-label" data-i18n="popTemplates">Templates</span>
        <span class="pop-badge" id="tplCount">0</span>
      </div>

      <button class="pop-btn ghost" id="pickEl" hidden data-i18n="popPick">🎯 Pick element → add rule</button>
      <button class="pop-btn ghost" id="rescan" hidden data-i18n="popRescan">↻ Re-scan this page</button>
      <button class="pop-btn primary" id="openOptions" data-i18n="popSettings">Settings · Manage templates</button>
      <button class="pop-btn ghost" id="addDomain" hidden data-i18n="popEnableSite">Enable on this site</button>
    </div>
    <script src="common.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
